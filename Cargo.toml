[workspace]
resolver = "2"
members = ["crates/br-validators", "crates/br-validators-cli", "crates/br-data-bot"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/open-data-brazil/br-validators-rust"
homepage = "https://github.com/open-data-brazil/br-validators-rust"
authors = ["Alexandre Zanata"]
keywords = ["brasil", "cpf", "cnpj", "validation", "open-data"]
categories = ["parser-implementations", "data-structures"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
proptest = "1"
criterion = { version = "0.8", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
