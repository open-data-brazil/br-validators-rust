[package]
name = "br-data-bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Atualização de dados públicos do br-validators"

[dependencies]
clap.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
calamine = "0.26"
# A série 2.6 alterou ZipFile e quebrou a API usada por calamine 0.26.
zip = { version = "=2.5.0", default-features = false, features = ["deflate"] }
scraper = "0.20"
encoding_rs = "0.8"
anyhow.workspace = true
br-validators = { path = "../br-validators", features = ["schema"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "=3.15.0"
