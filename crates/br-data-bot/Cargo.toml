[package]
name = "br-data-bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Atualização de dados públicos do br-validators"

[dependencies]
clap.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
csv = "1"
calamine = "0.38"
flate2 = "1"
tar = "0.4"
zip = { version = "=9.3.0", default-features = false, features = ["deflate"] }
scraper = { version = "0.29", features = ["deterministic"] }
encoding_rs = "0.8"
anyhow.workspace = true
br-validators = { version = "0.1.1", path = "../br-validators", features = ["schema"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "json", "cookies"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml_edit = "0.25"

[dev-dependencies]
tempfile = "=3.27.0"
