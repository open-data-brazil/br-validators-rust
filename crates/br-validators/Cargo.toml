[package]
name = "br-validators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Validadores de documentos brasileiros (CPF, CNPJ, …) e dados públicos oficiais embutidos"
readme = "../../README.md"
include = ["src/**", "data/**", "README.md", "LICENSE"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
generate = []
serde = ["dep:serde"]
schema = ["dep:serde"]
_data = ["schema", "dep:serde_json"]

aeroportos = ["_data"]
anp-combustiveis = ["_data"]
bancos = ["_data"]
cbo = ["_data"]
cep-faixas = ["_data"]
cest = ["_data"]
cfop = ["_data"]
cnaes = ["_data"]
cnpj-motivos = ["_data"]
csosn = ["_data"]
cst = ["_data"]
esocial = ["_data"]
feriados = ["_data"]
ibge = ["_data"]
ibpt = ["_data"]
incoterms = ["_data"]
inss = ["_data"]
irpf = ["_data"]
iss-municipal = ["_data"]
lc116 = ["_data"]
moedas = ["_data"]
natureza-juridica = ["_data"]
nbs = ["_data"]
ncm = ["_data"]
nfe-cuf = ["_data"]
paises-bacen = ["_data"]
pncp-reference = ["_data"]
portos = ["_data"]
ptax = ["_data"]
selic = ["_data"]
simples-nacional = ["_data"]
telefone-ddd = ["_data"]
transparencia-snapshots = ["_data"]
tse-municipios = ["_data"]

fiscal = ["cnaes", "cfop", "cst", "csosn", "ncm", "cest", "nbs", "lc116", "natureza-juridica", "cnpj-motivos", "ibpt", "iss-municipal", "nfe-cuf"]
trade = ["moedas", "ptax", "paises-bacen", "incoterms"]
finance = ["selic", "bancos"]
payroll = ["irpf", "inss", "esocial", "cbo", "simples-nacional"]
logistics = ["aeroportos", "portos", "anp-combustiveis"]
geo = ["ibge", "tse-municipios", "cep-faixas", "telefone-ddd", "feriados"]
gov = ["pncp-reference", "transparencia-snapshots"]
all-data = ["fiscal", "trade", "finance", "payroll", "logistics", "geo", "gov"]
full = ["all-data", "serde", "generate"]

[dev-dependencies]
serde_json.workspace = true
